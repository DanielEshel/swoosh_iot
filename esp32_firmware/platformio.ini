[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200 

lib_deps = 
    madhephaestus/ESP32Servo@^3.0.0
    h2zero/NimBLE-Arduino@^1.4.0

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBLUETOOTH_ENABLED=1